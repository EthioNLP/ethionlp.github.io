# The community photo gallery.
#
# One entry per image. `src` and `caption` are required; everything else is
# optional. Newest first is the convention, but the page sorts by `date`, so
# order in this file does not matter.
#
#   src      path under /resources/img/ or /assets/img/
#   caption  one sentence, what is happening, not just where
#   date     YYYY-MM-DD, or YYYY-MM when the day is not known
#   place    city and venue
#   people   names of those pictured, left to right, if they have agreed
#   event    slug of a file in _events/, which links the image to that event
#   link     any URL for more about the moment
#   credit   photographer, if known
#   tags     free-form, used as filter chips on the gallery page
#
# Adding photos: drop the file into resources/img/gallery/ and append an entry.
# Please use ASCII filenames; a previous image was named with mathematical bold
# Unicode characters, which several tools could not resolve.

