# The two ways to belong to EthioNLP. Both categories join the same groups
# and events; decisions about the direction of the community (which languages
# get priority, what gets released and how) rest with the people whose
# languages they are.

note: >-
  Both categories join the same groups and events. The difference is in who
  decides the community's direction.

categories:
  - id: member
    title: Member
    who: >-
      Ethiopians and Ethiopian diaspora, and anyone working extensively on
      Ethiopian languages.
    detail: >-
      "Extensively" means a sustained body of work rather than one paper:
      datasets, models, supervision, or years of linguistic fieldwork. Speakers
      of Ethiopian languages are members whatever their field, and students
      count from their first project.
    rights:
      - Listed in the community directory with a profile page
      - A voice in what the community prioritises and publishes
      - Can propose talks, mentor students and register a team
    featured: true

  - id: affiliate
    title: Affiliate member
    who: >-
      Researchers, engineers and organisations elsewhere who work with this
      community or want to support it.
    detail: >-
      Collaborators on a paper, people building multilingual systems that
      include Ethiopian languages, and anyone who found this site and wants to
      help. There is no quota and no waiting period.
    rights:
      - Listed in the directory, marked as an affiliate
      - The same access to the groups, seminars, mailing list and events
      - Can co-author, contribute data and code, and offer mentorship
    featured: false

# ─── Students chapter ───────────────────────────────────────────────────────
# Separate categories, so the chapter can be counted.
  - id: highschool
    title: Student member (high school)
    chapter: students
    who: >-
      School students in Ethiopia with an interest in computing, language or
      linguistics. No prior programming or research experience is expected.
    detail: >-
      A mentor who answers questions, and
      small, finishable tasks on real data. Work is chosen so that a first
      contribution takes weeks rather than months.
    rights:
      - A named mentor
      - Guided first contributions, reviewed before anything is published
      - Listed in the directory once a first contribution is merged
    featured: false

  - id: bachelor
    title: Student member (bachelor)
    chapter: students
    who: >-
      Undergraduates at any Ethiopian university, and Ethiopian
      undergraduates studying abroad.
    detail: >-
      Supervision for a final-year project, a route into an existing dataset
      or model effort, and co-authorship where the contribution earns it
      under the community's authorship standards. Open thesis topics are
      listed on the mentorship page.
    rights:
      - Supervision for a final-year project, and a named mentor
      - A route into an existing dataset or model effort
      - Co-authorship where the work earns it, on the same terms as anyone
      - Listed in the directory with a profile page
    featured: false
