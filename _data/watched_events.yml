# Events watched for community participation.
#
# Once a week a workflow checks each of these for people and teams listed on
# this site, and opens a pull request with a DRAFT news item for anything it
# finds. Drafts are never published automatically, see the note at the bottom.
#
# Fields
#   name        the event, as it should read in a headline    (required)
#   slug        stable id, used in the draft's filename       (required)
#   homepage    where to link the news item
#   pages       public URLs to search: programme, accepted papers, attendees
#   venue_match strings that identify the event in a publication's venue field
#   months      months it usually runs, so the scan can date the item
#
# `pages` and `venue_match` are two independent kinds of evidence and both are
# used. A programme page naming someone is direct evidence they took part; a
# paper of ours published at the venue that year is strong indirect evidence.
#
# ── On LinkedIn ──────────────────────────────────────────────────────────────
# LinkedIn is deliberately absent. It has no public API, its pages require an
# authenticated session, and scraping it breaks its terms of service, so a
# scanner built on it would be both unreliable and not something this project
# should ship. Where a LinkedIn post is the only record of something, use the
# "Share community news" issue form to submit it by hand; a person reading a
# post and writing two sentences beats a scraper that silently breaks.

- name: Deep Learning Indaba
  slug: deep-learning-indaba
  homepage: https://deeplearningindaba.com/
  pages:
    - https://deeplearningindaba.com/2025/
    - https://deeplearningindaba.com/2024/
  venue_match: [deep learning indaba, indaba]
  months: [8, 9]

