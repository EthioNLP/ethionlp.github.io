  abstract: 'We construct benchmark datasets for evaluating gender bias in machine translation for three
    low-resourced languages: Afan Oromo, Amharic and Tigrinya. From human evaluation of 2,400 gender-balanced
    sentences translated in parallel, about 93% of Afan Oromo, 80% of Tigrinya and 72% of Amharic sentences
    exhibited gender bias.'
