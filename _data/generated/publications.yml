  abstract: 'Adapting large language models (LLMs) to extremely low-resource languages remains challenging
    due to severe data scarcity and the lack of structured linguistic supervision.We introduce GCCLA,
    a graph-conditioned crosslingual adaptation framework that integrates multilingual knowledge graphs
    into parameterefficient LLM adaptation, conditioning a frozen multilingual LLM on structured semantic
    and typological relations to provide a strong inductive bias for data-efficient transfer.We instantiate
    and evaluate the framework through a focused case study on English-to-Amharic-to-Tigrinya transfer,
    where labeled data is extremely limited.By separating knowledge representation from language modeling,
    GCCLA stabilizes learning and improves sample efficiency in few-shot regimes.We evaluate the approach
    on five tasks, sentiment analysis, named entity recognition, natural language inference, question
