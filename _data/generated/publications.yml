  abstract: 'Nowadays, people are significantly affected by mental illnesses such as depression and anxiety
    disorders. These conditions can often be treated successfully if appropriate therapy is provided promptly.
    However, due to a shortage of mental health professionals, limited resources, economic constraints,
    and fear of social stigma, many people do not receive sufficient therapy. As a result, providing effective
    mental health interventions remains challenging. This study addresses this gap by designing and developing
    an Amharic language mental health chatbot to provide supportive counseling for depression and anxiety.
    The primary research question is as follows: How can a deep learning-based, retrieval-focused Amharic
    chatbot be effectively implemented to support mental health care? To achieve this, the study employed
    a design science research methodology, integrating natural language preprocessing with a Bidirectional
    Long Short-Term Memory (BiLSTM) network and Word2Vec embeddings to capture semantic relationships.
