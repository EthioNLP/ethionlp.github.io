  abstract: 'Numerous attempts for hypernymy relation (e.g., dog “is-a” animal) detection have been made
    for resourceful languages like English, whereas efforts made for low-resource languages are scarce
    primarily due to lack of gold-standard datasets and suitable distributional models. Therefore, we
    introduce four gold-standard datasets for hypernymy detection for each of the two languages, namely,
    Hindi and Bengali, and two gold-standard datasets for Amharic. Another major contribution of this
    work is to prepare distributional thesaurus (DT) embeddings for all three languages using three different
    network embedding methods (DeepWalk, role2vec, and M-NMF) for the first time on these languages and
    to show their utility for hypernymy detection. Posing this problem as a binary classification task,
