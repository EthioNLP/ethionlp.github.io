  abstract: Neo-fascism is a political and societal ideology that has been having remarkable growth in
    the last decade in the United States of America (USA), as well as in other Western societies. It poses
    a grave danger to democracy and the minorities it targets, and it requires active actions against
    it to avoid escalation. This work presents the first-of-its-kind neo-fascist coding scheme for digital
    discourse in the USA societal context, overseen by political science researchers. Our work bridges
    the gap between Natural Language Processing (NLP) and political science against this phenomena. Furthermore,
    to test the coding scheme, we collect a tremendous amount of activity on the internet from notable
