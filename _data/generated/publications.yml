  abstract: Investigative journalists and public defenders conduct the essential work of examining, reporting,
    and arguing critical cases around police use-of-force and misconduct. In an ideal world, they would
    have access to well-organized records they can easily navigate and search. In reality, records can
    come as large, disorganized data dumps, increasing the burden on the already resource-constrained
    teams. In a cross-disciplinary research team of stakeholders and computer scientists, we worked closely
    with public defenders and investigative journalists in the United States to co-design an AI-augmented
    tool that addresses challenges in working with such data dumps. Our Document Organization Tool (DOT)
    is a Python library that has data cleaning, extraction, and organization features. Our collaborative
    design process gave us insights into the needs of under-resourced teams who work with large data dumps,
    such as how some domain experts became self-taught programmers to automate their tasks. To understand
