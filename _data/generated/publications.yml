  abstract: The visual exploration of graphs encoding relationships between entities of multiple types
    (e.g., persons, locations,...) supports journalists in finding newsworthy information in large text
    collections. Journalists may have interest in certain entity types or their relations such as locations
    or person-person relations. This interest may change during the exploration process. The exploration
    of such large graphs is often supported by guidance using a degree-of-interest (DOI) function. Although
    many DOIs exist, they do not differentiate entity types, rely on additional data, or require complex
    settings overburding the journalists. We present a novel DOI for graphs with multiple types of entities.
    We show the interesting subgraph around the focal node and offer information about possible further
    steps. The user can interactively set her interest in entity types and entity relations. We apply
    our approach to a graph extracted from WikiLeaks PlusD Cablegate documents and report on journalists'
    feedback.
