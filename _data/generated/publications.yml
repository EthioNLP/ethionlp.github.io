  abstract: In this paper, we compare four state-of-the-art neural network dependency parsers for the
    Semitic language Amharic. As Amharic is a morphologically-rich and less-resourced language, the out-of-vocabulary
    (OOV) problem will be higher when we develop data-driven models. This fact limits researchers to develop
    neural network parsers because the neural network requires large quantities of data to train a model.
    We empirically evaluate neural network parsers when a small Amharic treebank is used for training.
    Based on our experiment, we obtain an 83.79 LAS score using the UDPipe system. Better accuracy is
    achieved when the neural parsing system uses external resources like word embedding. Using such resources,
    the LAS score for UDPipe improves to 85.26. Our experiment shows that the neural networks can learn
    dependency relations better from limited data while segmentation and POS tagging require much data.
