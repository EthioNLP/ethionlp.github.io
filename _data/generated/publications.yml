  abstract: Social media increasingly fuel extremism, especially right-wing extremism, and enable the
    rapid spread of antidemocratic narratives. Although AI and data science are often leveraged to manipulate
    political opinion, there is a critical need for tools that support effective monitoring without infringing
    on freedom of expression. We present KI4Demokratie, an AI-based platform that assists journalists,
    researchers, and policymakers in monitoring right-wing discourse that may undermine democratic values.
    KI4Demokratie applies machine learning models to a large-scale German online data gathered on a daily
    basis, providing a comprehensive view of trends in the German digital sphere. Early analysis reveals
    both the complexity of tracking organized extremist behavior and the promise of our integrated approach,
    especially during key events.
