  abstract: Trachoma is a neglected tropical eye disease caused by ocular strains of Chlamydia trachomatis,
    which affects millions of people worldwide. To examine the eye for signs of active trachoma, healthcare
    providers typically look for clusters of five or more follicles on the conjunctiva of the upper eyelid
    for the follicular inflammatory trachoma stage. However, it is also possible to find individual follicles
    scattered throughout the conjunctiva, particularly in mild or early-stage trachoma cases. Additionally,
    the datasets are photographic images collected in the field that can be high-dimensional and may contain
    large amounts of redundant information. We propose integrating novel attention-based feature extraction
