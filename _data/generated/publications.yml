  abstract: Even with various regulations in place across countries and social media platforms (Government
    of India, 2021; European Parliament and Council of the European Union, 2022, digital abusive speech
    remains a significant issue. One potential approach to address this challenge is automatic text detoxification,
    a text style transfer (TST) approach that transforms toxic language into a more neutral or non-toxic
    form. To date, the availability of parallel corpora for the text detoxification task (Logachevavet
    al., 2022; Atwell et al., 2022; Dementievavet al., 2024a) has proven to be crucial for state-of-the-art
    approaches. With this work, we extend parallel text detoxification corpus to new languages -- German,
    Chinese, Arabic, Hindi, and Amharic -- testing in the extensive multilingual setup TST baselines.
    Next, we conduct the first of its kind an automated, explainable analysis of the descriptive features
    of both toxic and non-toxic sentences, diving deeply into the nuances, similarities, and differences
