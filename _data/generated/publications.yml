  abstract: Evaluations of Large Language Models (LLMs) on knowledge-intensive tasks and factual accuracy
    often focus on high-resource languages primarily because datasets for low-resource languages (LRLs)
    are scarce. In this paper, we present Uhura -- a new benchmark that focuses on two tasks in six typologically-diverse
    African languages, created via human translation of existing English benchmarks. The first dataset,
    Uhura-ARC-Easy, is composed of multiple-choice science questions. The second, Uhura-TruthfulQA, is
    a safety benchmark testing the truthfulness of models on topics including health, law, finance, and
    politics. We highlight the challenges creating benchmarks with highly technical content for LRLs and
    outline mitigation strategies. Our evaluation reveals a significant performance gap between proprietary
    models such as GPT-4o and o1-preview, and Claude models, and open-source models like Meta's LLaMA
    and Google's Gemma. Additionally, all models perform better in English than in African languages.
