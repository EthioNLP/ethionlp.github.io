  abstract: 'Abstract Disagreement in annotation is a common phenomenon in the development of NLP datasets
    and serves as a valuable source of insight. While majority voting remains the dominant strategy for
    aggregating labels, recent work has explored modeling individual annotators to preserve their perspectives.
    However, modeling each annotator is resource-intensive and remains underexplored across various NLP
    tasks. We propose an agreement-based clustering technique to model the disagreement between the annotators.
    We conduct comprehensive experiments in 40 datasets in 18 typologically diverse languages, covering
    three subjective NLP tasks: sentiment analysis, emotion classification, and hate speech detection.
    We evaluate four aggregation approaches: majority vote, ensemble, multi-label, and multitask. The
    results demonstrate that agreement-based clustering can leverage the full spectrum of annotator perspectives
