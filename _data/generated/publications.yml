  abstract: Existing Large Multimodal Models (LMMs) generally focus on only a few regions and languages.
    As LMMs continue to improve, it is increasingly important to ensure they understand cultural contexts,
    respect local sensitivities, and support low-resource languages, all while effectively integrating
    corresponding visual cues. In pursuit of culturally diverse global multimodal models, our proposed
    All Languages Matter Benchmark (ALM-bench) represents the largest and most comprehensive effort to
    date for evaluating LMMs across 100 languages. ALM-bench challenges existing models by testing their
    ability to understand and reason about culturally diverse images paired with text in various languages,
    including many low-resource languages traditionally underrepresented in LMM research. The benchmark
    offers a robust and nuanced evaluation framework featuring various question formats, including true/false,
    multiple choice, and open-ended questions, which are further divided into short and long-answer categories.
    ALM-bench design ensures a comprehensive assessment of a model’s ability to handle varied levels of
