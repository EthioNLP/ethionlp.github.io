  arxiv: '1811.01137'
  anthology: null
  code: null
  dataset: null
  model: null
  abstract: 'We propose a method to transfer knowledge across neural machine translation\n(NMT) models
    by means of a shared dynamic vocabulary. Our approach allows to\nextend an initial model for a given
    language pair to cover new languages by\nadapting its vocabulary as long as new data become available
    (i.e., introducing\nnew vocabulary items if they are not included in the initial model). The\nparameter
    transfer mechanism is evaluated in two scenarios: i) to adapt a\ntrained single language NMT system
    to work with a new language pair and ii) to\ncontinuously add new language pairs to grow to a multilingual
    NMT system. In\nboth the scenarios our goal is to improve the translation performance, while\nminimizing
    the training convergence time. Preliminary experiments spanning five\nlanguages with different training
    data sizes (i.e., 5k and 50k parallel\nsentences) show a significant performance gain ranging from
    +3.85 up to +13.63\nBLEU in different language directions. Moreover, when compared with training an\nNMT
    model from scratch, our transfer-learning approach allows us to reach\nhigher performance after training
    up to 4% of the total training steps.\n'
