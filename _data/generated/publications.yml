  abstract: The importance of automatic question generation (AQG) systems in education is recognized for
    automating tasks and providing adaptive assessments. Recent research focuses on improving quality
    with advanced neural networks and machine learning techniques. However, selecting the appropriate
    target sentences and concepts remains challenging in AQG systems. To address this problem, the authors
    created a novel system that combined sentence structure analysis, dependency parsing approach, and
    named entity recognition techniques to select the relevant target words from the given sentence. The
    main goal of this paper is to develop an AQG system using syntactic and semantic sentence structure
    analysis. Evaluation using manual and automatic metrics shows good performance on simple and short
    sentences, with an overall score of 3.67 out of 5.0. As the field of AQG continues to evolve rapidly,
    future research should focus on developing more advanced models that can generate a wider range of
    questions, especially for complex sentence structures.
