  abstract: Internet-based social media sites such as Twitter represent a growing level of modern experience.
    These sites claim a large number of users and their influence is increasingly being experienced in
    clinical practice. Psychiatric disorders currently are affecting many people from different cultures,
    ages, and geographic locations. Although, the majority of individuals who experience symptom of psychiatric
    disorder practice the desire to be isolated, which drives them to use online channels to share their
    feelings. Hence, this sites provide a way to detect undiagnosed psychiatric disorders. In order to
