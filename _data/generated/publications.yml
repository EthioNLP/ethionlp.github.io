  abstract: Large language models (LLMs) have demonstrated significant capabilities in solving mathematical
    problems expressed in natural language. However, multilingual and culturally-grounded mathematical
    reasoning in low-resource languages lags behind English due to the scarcity of socio-cultural task
    datasets that reflect accurate native entities such as person names, organization names, and currencies.
    Existing multilingual benchmarks are predominantly produced via translation and typically retain English-centric
    entities, owing to the high cost associated with human annotator-based localization. Moreover, automated
    localization tools are limited, and hence, truly localized datasets remain scarce. To bridge this
    gap, we introduce a framework for LLM-driven cultural localization of math word problems that automatically
    constructs datasets with native names, organizations, and currencies from existing sources. We find
