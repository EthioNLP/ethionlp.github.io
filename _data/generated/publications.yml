  abstract: Visual Question Answering (VQA) is an important task in multimodal AI, and it is often used
    to test the ability of vision-language models to understand and reason on knowledge present in both
    visual and textual data. However, most of the current VQA models use datasets that are primarily focused
    on English and a few major world languages, with images that are typically Western-centric. While
    recent efforts have tried to increase the number of languages covered on VQA datasets, they still
    lack diversity in low-resource languages. More importantly, although these datasets often extend their
    linguistic range via translation or some other approaches, they usually keep images the same, resulting
    in narrow cultural representation. To address these limitations, we construct CVQA, a new Culturally-diverse
    multilingual Visual Question Answering benchmark, designed to cover a rich set of languages and cultures,
