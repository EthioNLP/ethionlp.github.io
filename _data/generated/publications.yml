  abstract: The aim of this study was to empirically examine e-learning acceptance and use in technology
    institutes of Ethiopian public universities. Samples of 400 university teachers were selected using
    simple random sampling technique. Structural equation modeling (SEM) analysis technique using SamrtPls
    tool has been used. The acceptance and use of e-learning systems have been evaluated and determinants
    were identified. Perceived ease of use and perceived usefulness were found to be significant determinants
    of behavioral intention to use e-learning systems. Behavioral intention, user training and management
    support were found to be major factors for actual usage of e-learning systems. Among the organizational
    factors, management support and user training have 56.6% contribution jointly and 30.7 and 25.9% contributions
    independently for the actual usage of e-learning systems. On the other hand, the impact of incentive
    on the actual usage of e-learning systems was found to be insignificant.
