  abstract: Topic modeling is a powerful technique to discover hidden topics and patterns within a collection
    of documents without prior knowledge. Traditional topic modeling and clustering-based techniques encounter
    challenges in capturing contextual semantic information. This study introduces an innovative end-to-end
    semantic-driven topic modeling technique for the topic extraction process, utilizing advanced word
    and document embeddings combined with a powerful clustering algorithm. This semantic-driven approach
    represents a significant advancement in topic modeling methodologies. It leverages contextual semantic
    information to extract coherent and meaningful topics. Specifically, our model generates document
    embeddings using pre-trained transformer-based language models, reduces the dimensions of the embeddings,
    clusters the embeddings based on semantic similarity, and generates coherent topics for each cluster.
    Compared to ChatGPT and traditional topic modeling algorithms, our model provides more coherent and
    meaningful topics.
