  abstract: The widespread availability of the Internet and the surge of social media have facilitated
    smoother communication, providing significant benefits for developing nations. However, these platforms
    also present challenges, particularly in the spread of hatred. Combating digital violence in low-resource
    languages typically involves building classification models to support content moderators. However,
    blocking messages is often insufficient, especially when freedom of speech is a concern. In such scenarios,
    text detoxification, rewriting messages to remove toxicity while preserving the original meaning,
    can be particularly beneficial, especially for protecting vulnerable groups like children. In this
    study, we develop text detoxification datasets and evaluate the effectiveness of LLMs in this task.
    Our findings reveal that even the latest LLM, GPT-4, falls short in effectively detoxifying low-resource
    languages.
