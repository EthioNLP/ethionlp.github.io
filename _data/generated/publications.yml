  abstract: 'Abstract The United Nations has defined 17 SDGs aimed at addressing fundamental human needs.
    While the SDGs are relevant to all countries and communities worldwide, they hold particular significance
    to Ethiopia. Scientific research dedicated to a specific country, or a region therein plays a crucial
    role in identifying the necessary interventions, planning appropriate courses of action, and monitoring
    progress toward achieving the SDGs. A considerable amount of scientific research directly or indirectly
    related to the SDGs, has been conducted on Ethiopia, but the research is fragmented and a clear overview
