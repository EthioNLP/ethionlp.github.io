  abstract: Abstract This study examines the complex relationship between social media, polarization,
    and conflict, with a focus on digital peacebuilding and women’s participation, using the Northern
    Ethiopia War as a case study. Using a qualitative exploratory design through in-depth interviews,
    focus groups, and document analysis, the research examines how social media platforms influence conflict
    dynamics. The study applies and advances social identity, liberal feminist, and intersectionality
    theories to analyze social media’s role in shaping conflict, mobilizing ethnic politics, and influencing
    women’s involvement in peacebuilding. Findings reveal that the weaponization of social media intensifies
    polarization and offline violence. Women are disproportionately impacted through displacement, exclusion
