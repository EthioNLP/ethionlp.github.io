  abstract: This paper introduces TigCLaF, a novel cross-lingual large language model framework for sentiment-aware
    text classification in low-resource Tigrigna. The framework integrates tokenizer extension with adaptation,
    continual pretraining on unlabeled Tigrigna data, and LoRA-based parameter-efficient fine-tuning to
    enable effective cross-lingual adaptation from high-resource languages. Leveraging recent advances
    in multilingual pre-trained language models and large language models, we investigate zero-shot, few-shot,
    and full fine-tuning strategies for sentiment detection, incorporating transformer models XLM-RoBERTa
    and AfriBERTa, as well as instruction-tuned LLaMA models. Our approach integrates a Tigrigna sentiment
    lexicon into transformer-based embeddings via feature fusion, thereby enhancing preservation of the
    sentiment signal during cross-lingual transfer. The proposed framework is evaluated on a newly curated
    dataset of 30,000 Tigrigna instances, supported by auxiliary English and Amharic sentiment corpora
