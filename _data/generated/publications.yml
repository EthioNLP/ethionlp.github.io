  abstract: Twitter has experienced a tremendous surge in popularity over recent years, establishing itself
    as a prominent social media platform with a large user base. However, with this increased usage, there
    has been a concerning rise in the number of individuals resorting to derogatory language and expressing
    their opinions in a demeaning manner toward others. This surge in hate speech has drawn significant
    attention to the field of sentiment analysis, which aims to develop algorithms capable of detecting
    and analyzing emotions expressed in social networks using intuitive approaches. This paper focuses
