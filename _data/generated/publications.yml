  abstract: Recent progress in the realm of artificial intelligence has shown effectiveness in various
    industries, particularly within the healthcare sector. However, there are limited insights on existing
    studies regarding ethical, social, privacy, and technological aspects of AI in the health sector,
    which is the gap our study aims to fill. This study aimed to synthesize empirical studies on the challenges
    and opportunities of using AI by conducting a systematic review. We reviewed 33 articles published
    between 2015 and 2022 in the PubMed, IEEE Xplore, and Science Direct databases. The results show that
    artificial intelligence has the promise of improving health care and faces obstacles when implemented.
