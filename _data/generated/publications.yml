  abstract: This software demonstration paper presents a project on the interactive visualization of social
    media data.The data presentation fuses German Twitter data and a social relation network extracted
    from German online news.Such fusion allows for comparative analysis of the two types of media.Our
    system will additionally enable users to explore relationships between named entities, and to investigate
