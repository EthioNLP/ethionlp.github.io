  abstract: The disparity in the languages commonly studied in Natural Language Processing (NLP) is typically
    reflected by referring to languages as low vs high-resourced.However, there is limited consensus on
    what exactly qualifies as a 'low-resource language.'To understand how NLP papers define and study
    'low resource' languages, we qualitatively analyzed 150 papers from the ACL Anthology and popular
    speechprocessing conferences that mention the keyword 'low-resource.' Based on our analysis, we show
    how several interacting axes contribute to 'low-resourcedness' of a language and why that makes it
    difficult to track progress for each individual language.We hope our work (1) elicits explicit definitions
    of the terminology when it is used in papers and (2) provides grounding for the different axes to
    consider when connoting a language as low-resource.
