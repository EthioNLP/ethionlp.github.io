  abstract: Machine learning has seen enormous growth in the last decade, with healthcare being a prime
    application for advanced diagnostics and improved patient care. The application of machine learning
    for healthcare is particularly pertinent in Africa, where many countries are resource-scarce. However,
    it is unclear how much research on this topic is arising from African institutes themselves, which
    is a crucial aspect for applications of machine learning to unique contexts and challenges on the
    continent. Here, we conduct a bibliometric study of African contributions to research publications
    related to machine learning for healthcare, as indexed in Scopus, between 1993 and 2022. We identified
    3,772 research outputs, with most of these published since 2020. North African countries currently
    lead the way with 64.5% of publications for the reported period, yet Sub-Saharan Africa is rapidly
