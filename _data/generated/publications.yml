  abstract: 'How can language learning systems be developed for languages that lack sufficient training
    resources? This challenge is increasingly faced by developers across the African continent who aim
    to build AI systems capable of understanding and responding in local languages. To address this gap,
    we introduce AFRILANGDICT, a collection of 194.7K African language-English dictionary entries designed
    as seed resources for generating language-learning materials, enabling us to automatically construct
    large-scale, diverse, and verifiable student-tutor question-answer interactions suitable for training
    AI-assisted language tutors. Using AFRILANGDICT, we build AFRILANGEDU, a dataset of 78.9K multi-turn
    training examples for Supervised Fine-Tuning (SFT) and Direct Preference Optimization (DPO). Using
    AFRILANGEDU, we train language tutoring models collectively referred to as AFRILANGTUTOR. We fine-tune
    two multilingual LLMs: Llama-3-8B-IT and Gemma-3-12B-IT on AFRILANGEDU across 10 African languages
    and evaluate their performance. Our results show that models trained on AFRILANGEDU consistently outperform
