  abstract: Designing an explainable model becomes crucial now for Natural Language Processing (NLP) since
    most of the state-of-the-art machine learning models provide a limited explanation for the prediction.
    In the spectrum of an explainable model, Tsetlin Machine (TM) is promising because of its capability
    of providing word-level explanation using proposition logic. However, concern rises over the elaborated
    combination of literals (propositional logic) in the clause that makes the model difficult for humans
    to comprehend, despite having a transparent learning process. In this paper, we design a post-hoc
    pruning of clauses that eliminate the randomly placed literals in the clause thereby making the model
    more efficiently interpretable than the vanilla TM. Experiments on the publicly available YELP-HAT
    Dataset demonstrate that the proposed pruned TM's attention map aligns more with the human attention
    map than the vanilla TM's attention map. In addition, the pairwise similarity measure also surpasses
