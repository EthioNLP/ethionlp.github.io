  abstract: Natural Language Processing (NLP) is undergoing constant transformation, as Large Language
    Models (LLMs) are driving daily breakthroughs in research and practice. In this regard, tracking the
    progress of NLP research and automatically analyzing the contributions of research papers provides
    key insights into the nature of the field and the researchers. This study explores the progress of
    African NLP (AfricaNLP) by asking (and answering) research questions about the progress of AfricaNLP
    (publications, NLP topics, and NLP tasks), contributions (data, method, and task), and contributors
    (authors, affiliated institutions, and funding bodies). We quantitatively examine two decades (2005
    - 2025) of contributions to AfricaNLP research, using a dataset of 2.2K NLP papers, 4.9K contributing
    authors, and 7.8K human-annotated contribution sentences (AfricaNLPContributions), along with benchmark
    results. Our dataset and AfricaNLP research explorer tool will provide a powerful lens for tracing
    AfricaNLP research trends and holds potential for generating data-driven research approaches. The
    resource can be found in GitHub.
