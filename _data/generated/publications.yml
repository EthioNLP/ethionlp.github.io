  abstract: 'In this article, we demonstrate the impact of interactive machine learning: we develop biomedical
    entity recognition dataset using a human-into-the-loop approach. In contrary to classical machine
    learning, human-in-the-loop approaches do not operate on predefined training or test sets, but assume
    that human input regarding system improvement is supplied iteratively. Here, during annotation, a
    machine learning model is built on previous annotations and used to propose labels for subsequent
    annotation. To demonstrate that such interactive and iterative annotation speeds up the development
    of quality dataset annotation, we conduct three experiments. In the first experiment, we carry out
    an iterative annotation experimental simulation and show that only a handful of medical abstracts
