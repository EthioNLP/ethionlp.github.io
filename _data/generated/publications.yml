  title: Automatic Annotation Suggestions and Custom Annotation Layers in WebAnno
  authors:
  - name: Seid Muhie Yimam
    member: seid-muhie-yimam
  - name: Chris Biemann
  - name: Richard Eckart de Castilho
  - name: Iryna Gurevych
  year: 2014
  venue: Annual Meeting of the Association for Computational Linguistics
  type: conference
  doi: 10.3115/v1/p14-5016
  url: https://doi.org/10.3115/v1/p14-5016
  arxiv: null
  anthology: P14-5016
  code: null
  dataset: null
  model: null
  abstract: In this paper, we present a flexible approach to the efficient and exhaustive manual annotation
    of text documents.For this purpose, we extend WebAnno (Yimam et al., 2013) an open-source web-based
    annotation tool. 1 While it was previously limited to specific annotation layers, our extension allows
    adding and configuring an arbitrary number of layers through a web-based UI.These layers can be annotated
    separately or simultaneously, and support most types of linguistic annotations such as spans, semantic
    classes, dependency relations, lexical chains, and morphology.Further, we tightly integrate a generic
    machine learning component for automatic annotation suggestions of span annotations.In two case studies,
    we show that automatic annotation suggestions, combined with our split-pane UI concept, significantly
    reduces annotation time.
