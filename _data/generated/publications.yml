  abstract: Human annotation is the empirical foundation of much NLP research, from dataset construction
    to model evaluation, but papers often leave unclear who produced the annotations and how the annotation
    process was controlled. We provide the first large-scale, task-level audit of human annotation reporting
    across major NLP venues, asking which annotation details are documented, which are missing, and how
    reporting varies across time, topic, venue, and intended use of human judgment. We introduce a unified
    taxonomy of annotation-reporting practices and validate an LLM-assisted extraction pipeline against
    Annotated-gold, a human-adjudicated gold standard of 41 papers and 72 annotation tasks, where the
    best model reaches human-comparable agreement with adjudicated labels, with Krippendorff's alpha of
    0.606 versus 0.585 for human-human agreement. Using this pipeline, we construct Annotated-llm, a dataset
    covering ACL-venue papers from 2018-2025, with 2,667 extracted annotation tasks from 1,603 papers,
