  abstract: We investigate multilingual sentiment analysis and interpretability across high-and low-resource
    languages, focusing on Amharic, English, German, and Hausa.Our study evaluates encoder-only transformer
    models for both sequence-level sentiment classification and token-level attribution using Captum.Additionally,
    we assess zero-and few-shot decoder-only models for sequence-level sentiment prediction.Our results
    show that few-shot decoder-only models outperform encoder-only models on token-level sentiment classification
    in most languages, with the exception of Hausa, where a multilingual encoder-based model leads.For
    sequence-level sentiment classification, encoder-only models generally achieve strong performance
    across most languages, but decoder-only models are highly competitive, and may even surpass encoders,
    in the high-resource settings (German, English) and low-resource scenarios, depending on the prompting
    strategy.These findings highlight the utility of combining fine-tuned transformer models with promptbased
