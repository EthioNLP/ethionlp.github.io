  abstract: Morphological analyzer is the base for various high-level NLP applications such as information
    retrieval, spell checking, grammar checking, machine translation, speech recognition, POS tagging
    and automatic sentence construction. This paper is carefully designed for design and analysis of morphological
    analyzer Tigrigna verbs using hybrid of memory learning and rules based approaches. The experiment
    have conducted using Python 3 where TiMBL algorithms IB2 and TRIBL2, and Finite State Transducer rules
    are used. The performance of the system has been evaluated using 10 fold cross validation technique.
    Testing was conducted using optimized parameter settings for regular verbs and linguistic rules of
    the Tigrigna language allomorph and phonology for the irregular verbs. The accuracy of the memory
    based approach with optimized parameters of TiMBL algorithm IB2 and TRIBL2 was 93.24% and 92.31%,
    respectively. Finally, the hybrid approach had an actual performance of 95.6% using linguistic rules
    for handling irregular and copula verbs.
