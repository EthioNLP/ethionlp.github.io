  abstract: Abstract Artificial intelligence systems offer valuable support to the education sector by
    automating routine tasks for instructors and providingadaptive assessments. These assessments are
    a crucial component ofautomatic question-generation techniques. There are various techniquesfor question
    generation described in the literature. This paper introduces a novel rule-based system for automatic
    question generationthat employs dependency parsing techniques. The proposed methodfocuses on analyzing
    both the syntactic and semantic structure of asentence. The paper includes both manual and automatic
    evaluationmetrics to assess the questions generated by our proposed system. Inthe evaluation, our
    system received an overall score of 3.67 out of5.0 for human-level performance, an average BlEU−N
    score of 0.718,and F1−score scores above 0.5 for all types of ROUGE. Both humanand automatic evaluation
    results demonstrate that our proposed system achieves good performance on simple and short sentences.
    In thefuture, we plan to enhance our model by incorporating phrase-levelparsing to further improve
    the proposed dependency parsing techniques.
