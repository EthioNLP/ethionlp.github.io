  abstract: Dynamic graph processing, execution on vertex-edge graphs that change over time, is quickly
    becoming a key computing need of the twenty-first century. Dynamic graph algorithms unlock real-time
    optimization solutions and a wide range of data-mining applications in logistics, finance, marketing,
    healthcare, and social media, among many others. However, graph algorithms are extremely memory-bound
    (i.e., their performance is limited by the bandwidth of memory accesses on the underlying hardware
    platform, rather than the compute capacity). Moreover, dynamic graph algorithms are being applied
    to increasingly-large datasets, further straining the memory systems and reducing performance. As
    a result, additional research is needed to leverage new memory technologies for faster, more efficient,
    dynamic graph-based processing. Such research is difficult without access to hitherto unavailable
    industrial-scale dynamic graph datasets to evaluate solutions.
