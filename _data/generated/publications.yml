  abstract: This paper presents an Amharic hate speech annotation using the Yandex Toloka crowdsourcing
    platform. The dataset for this paper is collected from 5 consecutive years in Ethiopia (5Js), namely
    from 2018-2022, following the ‘June’ events in Ethiopia. Every June for the last five years, some
    events put the country in violence. Accordingly, we annotate 5,267 tweets, nearly 1k tweets every
    year. We explore the main challenges of crowdsourcing annotation for Amharic hate speech data collection
    using Toloka. We attain a Fliess kappa score of 0.34 using three independent annotators that annotate
