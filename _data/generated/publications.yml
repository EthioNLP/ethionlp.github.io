  abstract: Mobile phone is one of the most widely and extensively used devices for communication across
    the world for both personal and business activities.The capabilities of mobile phones have been improving
    very quickly in terms of computing power, storage, feature support, and developed applications.Mobile
    Cloud Computing simply refers to an infrastructure where both the data storage and the data processing
    are made to happen outside of the mobile phones.With the advent of cloud services for mobile application,
    it has greatly enhanced the scalability and security.Hence, it stores contact numbers and messages
    sent from different mobile users in its memory and SIM card.However, if the mobile phone or the SIM
    card is lost or damaged due to different incidents, the information stored before can decidedly be
    lost.Such instant is very costly and risky for recovery of the lost information.Most cloud file storage
