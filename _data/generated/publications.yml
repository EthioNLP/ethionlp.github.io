  abstract: In this paper, we describe an attempt towards the development of parallel corpora for English
    and Ethiopian Languages, such as Amharic, Tigrigna, Afan-Oromo, Wolaytta and Ge’ez. The corpora are
    used for conducting a bi-directional statistical machine translation experiments. The BLEU scores
    of the bi-directional Statistical Machine Translation (SMT) systems show a promising result. The morphological
