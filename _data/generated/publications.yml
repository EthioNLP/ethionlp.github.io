    dissemination, particularly on social media platforms. Misinformation can spread quickly due to the
    ease of creating and disseminating content, affecting public opinion and sociopolitical events. Identifying
    false information is therefore essential to reducing its negative consequences and maintaining the
    reliability of online news sources. Traditional approaches to fake news detection often rely solely
