  abstract: Human-computer interaction increasingly demands systems that recognize not only explicit user
    inputs but also implicit emotional states. While substantial progress has been made in affective computing,
    most emotion recognition systems rely on cloud-based inference, introducing privacy vulnerabilities
    and latency constraints unsuitable for real-time applications. This work presents a comprehensive
    evaluation of machine learning architectures for on-device emotion recognition from wrist-based photoplethysmography
    (PPG), systematically comparing different models spanning classical ensemble methods, deep neural
