  abstract: 'We present the first shared task on Semantic Textual Relatedness (STR). While earlier shared
    tasks primarily focused on semantic similarity, we instead investigate the broader phenomenon of semantic
    relatedness across 14 languages: Afrikaans, Algerian Arabic, Amharic, English, Hausa, Hindi, Indonesian,
    Kinyarwanda, Marathi, Moroccan Arabic, Modern Standard Arabic, Punjabi, Spanish, and Telugu. These
    languages originate from five distinct language families and are predominantly spoken in Africa and
    Asia -- regions characterised by the relatively limited availability of NLP resources. Each instance
    in the datasets is a sentence pair associated with a score that represents the degree of semantic
    textual relatedness between the two sentences. Participating systems were asked to rank sentence pairs
    by their closeness in meaning (i.e., their degree of semantic relatedness) in the 14 languages in
    three main tracks: (a) supervised, (b) unsupervised, and (c) crosslingual. The task attracted 163
