  abstract: 'Large language models (LLMs) often lack culture-specific knowledge of daily life, especially
    across diverse regions and non-English languages. Existing benchmarks for evaluating LLMs'' cultural
    sensitivities are limited to a single language or collected from online sources such as Wikipedia,
    which do not reflect the mundane everyday lifestyles of diverse regions. That is, information about
    the food people eat for their birthday celebrations, spices they typically use, musical instruments
    youngsters play, or the sports they practice in school is common cultural knowledge but uncommon in
    easily collected online sources, especially for underrepresented cultures. To address this issue,
    we introduce BLEnD, a hand-crafted benchmark designed to evaluate LLMs'' everyday knowledge across
    diverse cultures and languages. BLEnD comprises 52.6k question-answer pairs from 16 countries/regions,
    in 13 different languages, including low-resource ones such as Amharic, Assamese, Azerbaijani, Hausa,
    and Sundanese. We construct the benchmark to include two formats of questions: short-answer and multiple-choice.
