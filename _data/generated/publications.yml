  abstract: 'Data voids—areas of the internet where reliable information is scarce or absent—pose significant
    challenges to online health information seeking, particularly for users operating in low-web data
    languages. These voids are increasingly encountered not on traditional search engine alone, but on
    social media platforms, which have gradually morphed into informal search engines for millions of
    people. In this paper, we introduce the phenomenon of data horizons: a critical boundary where algorithmic
    structures begin to degrade the relevance and reliability of search results. Unlike the core of a
    data void, which is often exploited by bad actors to spread misinformation, the event horizon marks
    the critical space where systemic factors, such as linguistic under-representation, algorithmic amplification,
    and socio-cultural mismatch, create conditions of informational instability. Focusing on Tigrinya
    and Amharic as languages of study, we evaluate (1) the common characteristics of search results for
