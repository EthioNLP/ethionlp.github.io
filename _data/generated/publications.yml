  abstract: 'Comparative Question Answering (cQA) is the task of providing concrete and accurate responses
    to queries such as: “Is Lyft cheaper than a regular taxi?” or “What makes a mortgage different from
    a regular loan?”. In this paper, we propose two new open-domain real-world datasets for identifying
    and labeling comparative questions. While the first dataset contains instances of English questions
    labeled as comparative vs. non-comparative, the second dataset provides additional labels including
    the objects and the aspects of comparison. We conduct several experiments that evaluate the soundness
    of our datasets. The evaluation of our datasets using various classifiers show promising results that
    reach close-to-human results on a binary classification task with a neural model using ALBERT embeddings.
    When approaching the unsupervised sequence labeling task, some headroom remains.'
