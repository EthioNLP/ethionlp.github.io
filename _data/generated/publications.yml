  abstract: 'Processing of textual information by using word-processing tools is extremely increased due
    to the presence of misspelled or erroneous words. In order to minimize these misspelled words from
    digital information, different spellchecker tools are needed. A plenty of works are performed in technological
    favored languages like English and European languages but not for an underresourced language like
    Dawurootsuwa. The primary idea behind a morphology-based spellchecker is to use a dictionary lookup
    approach with morphological properties of the language to reduce dictionary size while also handling
    word inflection, derivation, and compounding. Two distinct tests were carried out in this work to
    evaluate the performance of a morphology-based spellchecker: error detection and error correction.
    The Hunspell dictionary format was utilized to construct the root words in this study, which included
    a total of 5,000 root words and more than 2,500 morphological rules along with 3,156 unique words
    for testing. The experimental result showed the overall spell error detection performance of 90.4%
    and the overall spell error correction performance of 79.31%. Moreover, we are working further towards '
