  abstract: Knowing the size of a software early (i.e., requirement stage) helps to manage software projects
    ahead of resources, especially in agile approach. With the proliferation of agile software industries,
    large number of requirements are not clearly defined at the early phase of the software development
    and are left unmeasured, this leads to inaccurate size and effort estimations and in turn failure
    of software projects. In addition, it is challenging to apply Common Software Measurement International
    Consortium (COSMIC) standard in agile developments. This is because COSMIC needs strict formalization
    of requirements, whereas agile relies on less formal specifications. Having a formal or informal functional
    process or user story description, COSMIC-based estimation divides this process description in to
    four data elements (entry, read, write, and exit) and finally counts the number of each data element
    so that the size of such process description will be determined (small, medium, large, and complex).
