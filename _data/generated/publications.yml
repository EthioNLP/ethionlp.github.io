  abstract: Automatic Speech Recognition (ASR) systems are a crucial technology that is used today to
    design a wide variety of applications, most notably, smart assistants, such as Alexa. ASR systems
    are essentially dialogue systems that employ Spoken Language Understanding (SLU) to extract meaningful
    information from speech. The main challenge with designing such systems is that they require a huge
    amount of labeled clean data to perform competitively, such data is extremely hard to collect and
    annotate to respective SLU tasks, furthermore, when designing such systems for low resource languages,
