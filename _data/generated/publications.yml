  abstract: ASR has achieved remarkable global progress, yet African low-resource languages remain rigorously
    underrepresented, producing barriers to digital inclusion across the continent with more than +2000
    languages. This systematic literature review (SLR) explores research on ASR for African languages
    with a focus on datasets, models and training methods, evaluation techniques, challenges, and recommends
    future directions. We employ the PRISMA 2020 procedures and search DBLP, ACM Digital Library, Google
    Scholar, Semantic Scholar, and arXiv for studies published between January 2020 and July 2025. We
    include studies related to ASR datasets, models or metrics for African languages, while excluding
    non-African, duplicates, and low-quality studies (score <3/5). We screen 71 out of 2,062 records and
    we record a total of 74 datasets across 111 languages, encompassing approximately 11,206 hours of
    speech. Fewer than 15% of research provided reproducible materials, and dataset licensing is not clear.
