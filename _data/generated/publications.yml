  abstract: The necessity of a system that supports query-based searching with the presence of more than
    7,154 world languages also increases as the accessibility of information across languages increases.
    The most challenging task is gathering knowledge in various natural languages, which calls for a lot
    of resources like databases and digital libraries and others. Nowadays, accessing information in multiple
    languages is also one of the problems. In this multilingual world it is common to see language barriers
    while seeking information in our native language. This is especially true for under-resourced Ethiopian
    language, specifically for Wolaytta language. Therefore, the main goal of Cross-lingual Information
    Retrieval (CLIR) is to enable users submitting a query in one language and retrieve relevant documents
    in another language. The development of Wolaytta-English CLIR enables Wolaytta language speakers to
