name: Issue form to pull request

# Turns a filled-in "Join EthioNLP" or "Propose a talk" issue into a pull
# request adding the corresponding file. The person who opened the issue is
# credited and gets a comment linking to the pull request.

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  convert:
    # Runs for every issue and decides below. The gate used to require one of
    # the form labels, but GitHub only attaches a template's labels when the
    # issue is actually created from that template: an issue opened any other
    # way arrives unlabelled, the gate never matched, and the run was skipped
    # with no explanation. Detection now falls back to the body.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r scripts/requirements.txt

      - name: Work out which form this was
        id: kind
        env:
          LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
          BODY: ${{ github.event.issue.body }}
        run: |
          BODY_FILE=/tmp/issue-detect.md
          printf '%s' "$BODY" > "$BODY_FILE"

          kind=""
          # A label is the reliable signal when the template applied one.
          case "$LABELS" in
            *join*)    kind=member ;;
            *team*)    kind=team ;;
            *news*)    kind=news ;;
            *gallery*) kind=photo ;;
            *topic*)   kind=topic ;;
            *event*)   kind=event ;;
          esac

          # No usable label: read the body. Each template writes its own field
          # headings, so they identify the form even with no label at all.
          if [ -z "$kind" ]; then
            if   grep -qF '### The photograph' "$BODY_FILE"; then kind=photo
            elif grep -qF '### Title' "$BODY_FILE" && grep -qF '### Who would supervise it' "$BODY_FILE"; then kind=topic
            elif grep -qF '### Headline' "$BODY_FILE"; then kind=news
            elif grep -qF '### What is the team called' "$BODY_FILE"; then kind=team
            elif grep -qF '### When is it' "$BODY_FILE"; then kind=event
            # Last resort: an image pasted into an issue with nothing else.
            # The attachment is the content and the title describes it, which
            # is the one case worth accepting without a form.
            elif grep -qE 'user-attachments|user-images\.githubusercontent\.com' "$BODY_FILE"; then kind=photo
            fi
          fi

          if [ -z "$kind" ]; then
            echo "No form fields and no attachment; nothing to build." >&2
          fi
          echo "kind=${kind}" >> "$GITHUB_OUTPUT"

      - name: Save the issue body
        env:
          BODY: ${{ github.event.issue.body }}
        run: printf '%s' "$BODY" > /tmp/issue.md

      - name: Build the file
        id: build
        if: steps.kind.outputs.kind != ''
        env:
          TITLE: ${{ github.event.issue.title }}
        run: |
          set -o pipefail
          if path=$(python3 scripts/from_issue.py --kind "${{ steps.kind.outputs.kind }}" --body-file /tmp/issue.md --title "$TITLE" 2>/tmp/err.txt); then
            echo "path=$path" >> "$GITHUB_OUTPUT"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            {
              echo 'error<<EOF'
              tail -n 20 /tmp/err.txt
              echo EOF
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Explain what went wrong
        if: steps.build.outputs.ok == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                "Thanks for this; the automatic step could not complete it:",
                "",
                "```",
                `${{ steps.build.outputs.error }}`,
                "```",
                "",
                "Edit the issue to fix it and a maintainer will re-run this, or just",
                "say so below and someone will add it by hand. Nothing is lost either way.",
              ].join("\n"),
            });

      - name: Open the pull request
        if: steps.build.outputs.ok == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: contrib/issue-${{ github.event.issue.number }}
          delete-branch: true
          commit-message: "${{ steps.kind.outputs.kind }}: from #${{ github.event.issue.number }}"
          title: "${{ github.event.issue.title }}"
          labels: from-issue
          body: |
            Generated from #${{ github.event.issue.number }}, opened by @${{ github.event.issue.user.login }}.

            Adds `${{ steps.build.outputs.path }}`.

            **Reviewers:** check the name spelling, the affiliation and, for a
            member, that the resolved OpenAlex id belongs to the right person.
            Author names are widely shared and a wrong id attributes someone
            else's papers. After merging, the nightly sync fills in the rest.

            Closes #${{ github.event.issue.number }}
